# yad-managed-include: yad-product-bridge
# Merge-time gate sync for the PRODUCT, as an INCLUDABLE fragment (Path B). Pulled into the
# Product's root .gitlab-ci.yml via:
#   include:
#     - local: '.gitlab/ci/yad-gate-sync.yml'
# so wiring never edits the foreign root pipeline beyond that one include line. The job carries
# `needs: []` and no `stage:` (same merge-safety as the yad-checks fragment).
#
# CI is the SOLE writer of the ledger, and it writes ONLY at merge, ONLY to the default branch.
# During review there is NO CI write: the MR itself is the source of truth (native approvals +
# threads). CI never pushes to the MR source (review) branch, so an in-flight approval is never
# dismissed by a CI commit. Because nothing is pushed to the source branch, you can safely enable
# "Remove all approvals when commits are added to the source branch" — only the artifact owner's own
# pushes will dismiss approvals (the intended revoke-on-change).
#
# GitLab is the DEGRADED platform, stated honestly: it fires no pipeline on an approval, and the
# merge push to the default branch may omit the source-branch name (squash / fast-forward). So the
# ledger is reconciled from the PLATFORM (glab API), not from any per-branch ledger:
#   - MERGE push (default branch, commit names a review branch): resolve the merged MR's IID from its
#     source branch, then advance + flip status on the default branch — near-immediate.
#   - SCHEDULED sweep (catch-up): enumerate recently-merged review MRs via the API and advance any
#     not yet advanced (idempotent — an already-`done` step is never re-advanced, and re-syncing it
#     writes nothing unless its approvals changed). Covers bare approvals and
#     squash merges whose commit message dropped the branch name. Create a pipeline schedule
#     (one-time, cannot be committed as code): cron `*/15 * * * *` with variable SDLC_GATE_SYNC=true.
#     UI: CI/CD > Schedules, or:
#       glab api projects/:id/pipeline_schedules -X POST \
#         -f description='yad gate sync' -f ref=main -f cron='*/15 * * * *'
#       glab api "projects/:id/pipeline_schedules/<id>/variables" -X POST \
#         -f key=SDLC_GATE_SYNC -f value=true
#
# Token: CI_JOB_TOKEN can neither read the approvals API nor push to a protected branch. Create a
# PROJECT ACCESS TOKEN with `read_api` + `write_repository` (role Developer+, allowed to push to the
# default branch — the merge advance pushes there) and store it as a masked CI/CD variable
# SDLC_GATE_TOKEN. Without it the job fails visibly; recover by setting the token, then re-run the
# pipeline or run `yad gate ci --branch <review-branch> --pr <iid> --merged` locally on the default
# branch (advisory `yad gate sync` is read-only in verified mode and cannot recover a stuck gate).
#
# Which yadflow this job runs: an EXACT version resolved from the repo at run time — see the `yad-pin`
# block in the script below for the precedence. It no longer floats on the major, because floating let a
# release change what a scheduled job does with nobody deciding to upgrade (issue #163, where 3.13.1
# took one Product from 20 to 96 churn commits an hour). The trade-off is deliberate and cuts both ways: a
# Product is no longer carried onto a fix automatically, so if the resolved pin is older than 3.15.3, run
# `yad update` or disable this schedule.
#
# To override it, set a CI/CD variable YAD_VERSION (e.g. `4.0.0`) in project Settings → CI/CD →
# Variables — the same place SDLC_GATE_TOKEN lives, and deliberately NOT in this file, which `yad` owns
# and rewrites byte-for-byte from its template on every sync.
variables:
  GIT_DEPTH: "0" # full history: gate ci pushes the advance to the default branch

yad-gate-sync:
  needs: []
  # Serialize every advance: the merge-push pipeline and the scheduled sweep both commit the ledger
  # and push the DEFAULT branch, and the sweep's 7-day window covers MRs the merge path is still
  # processing — so without this they race on the same MR. Both produce the advance, one pushes, the
  # loser rebases onto it and pushes the same commit message under a different SHA. That is where the
  # duplicate `chore(gate): advance …` commits with shifting SHAs come from, and every one of them
  # carries [skip ci] and lands directly on the default branch, so nothing validates the churn.
  # `resource_group` is GitLab's equivalent of the `concurrency` group the GitHub workflow sets on both
  # of its jobs: at most one instance runs at a time, the rest queue.
  resource_group: yad-gate-mergesync
  # Runner selection: set the YAD_RUNNER_TAGS CI/CD variable (e.g. `dind_runner`) to route this
  # docker job on instances whose runners are tag-locked (run_untagged: false) — it lives in
  # project Settings → CI/CD → Variables, so it survives every `yad` sync. When unset, current
  # GitLab (>=15) runs the job untagged; older versions may strand it — set a real tag if so.
  tags: [$YAD_RUNNER_TAGS]
  image: node:${YAD_NODE_VERSION}
  variables:
    # A project/group CI/CD variable overrides this YAML value, so the Node line can be changed in project
    # settings without editing the managed fragment (a current 20, 22 or 24 line). A shell-executor runner
    # ignores `image:` — Node must then be on the runner host's PATH, and this value has no effect.
    YAD_NODE_VERSION: "22"
  rules:
    # Merge path: branch pipeline on the default branch whose merge commit names a review branch.
    # Squash/fast-forward merges may omit the branch name — those advance on the next scheduled sweep.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /review\/EP-/
    # Scheduled sweep: the only path that picks up bare approvals (advances merged reviews it finds).
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SDLC_GATE_SYNC == "true"
  script:
    # Pinned glab binary (the node image has no glab). Alternative: image registry.gitlab.com/gitlab-org/cli.
    - GLAB_VERSION=1.55.0
    - curl -fsSL "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_linux_amd64.deb" -o /tmp/glab.deb && dpkg -i /tmp/glab.deb
    # Pinned jq binary (the node image has none, and `glab api` has NO built-in --jq like `gh api` does —
    # it errors "unknown flag: --jq"). We fetch raw JSON from glab and filter it through real jq;
    # jq streams glab's concatenated per-page --paginate arrays natively.
    - JQ_VERSION=1.7.1
    - curl -fsSL "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64" -o /usr/local/bin/jq && chmod +x /usr/local/bin/jq
    # Pinned git-lfs, ONLY for a Product that uses Git LFS (issue #327). The runner clones an LFS repo
    # with its own git-lfs and installs LFS git hooks (post-checkout, pre-push, …) that exit with an
    # error when git-lfs is missing — and the node image has none. So the `git checkout` below failed, and so
    # would the push of the advance. A Product without LFS skips the download. Only the clone's own
    # signs count (its hooks, its .git/config, its .gitattributes) — never a global git setting.
    # The download is checked against the release's published SHA-256 (sha256sums.asc) before it is
    # unpacked: this job holds a token that can push the default branch, and git-lfs then runs on every
    # checkout and push. One command per line, not an `&&` chain — `set -e` does not stop on a failure
    # inside a chain, so a bad checksum would fall through to the checkout.
    - |
      GIT_LFS_VERSION=3.8.0
      GIT_LFS_SHA256=e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d
      if ! command -v git-lfs >/dev/null 2>&1 && { grep -qs git-lfs "$(git rev-parse --git-path hooks)"/* || git config --local --get-regexp '^filter\.lfs\.' >/dev/null 2>&1 || grep -qs 'filter=lfs' .gitattributes; }; then
        curl -fsSL "https://github.com/git-lfs/git-lfs/releases/download/v${GIT_LFS_VERSION}/git-lfs-linux-amd64-v${GIT_LFS_VERSION}.tar.gz" -o /tmp/git-lfs.tar.gz
        echo "${GIT_LFS_SHA256}  /tmp/git-lfs.tar.gz" | sha256sum -c -
        tar -xzf /tmp/git-lfs.tar.gz -C /tmp "git-lfs-${GIT_LFS_VERSION}/git-lfs"
        install -m 0755 "/tmp/git-lfs-${GIT_LFS_VERSION}/git-lfs" /usr/local/bin/git-lfs
      fi
    - git config user.name "yad-gate-sync" && git config user.email "yad-gate-sync@noreply.${CI_SERVER_HOST}"
    - git remote set-url origin "https://oauth2:${SDLC_GATE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - export GITLAB_TOKEN="$SDLC_GATE_TOKEN" GITLAB_HOST="$CI_SERVER_URL"
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
    - |
      # >>> yad-pin
      # Which yadflow this job runs, most explicit source first:
      #   1. $YAD_VERSION            — the CI/CD variable, a human's deliberate override, verbatim
      #   2. .sdlc/product.json      — "gate_sync_version" (.sdlc/hub.json when it is absent), the committed pin for this Product
      #   3. .sdlc/cli-version.json  — the version that last wired it (`yad update` re-stamps this)
      #   4. $YAD_MAJOR              — floating major, only when nothing above resolves
      # Sources 2 and 3 are machine-written files a stale or hand-edited checkout can get wrong, so
      # they are VALIDATED: an exact release token of the major this fragment was written for. That
      # also keeps the value safe to interpolate into `npx -p "yadflow@$V"` — a repo-controlled
      # string reaching a shell on a runner holding a push token. Anything unparseable is skipped
      # loudly rather than failing the run. Resolved once here; GitLab runs every `script` line in
      # the same shell, so YAD_PKG carries into the block below.
      # Pipes, not bash here-strings: a GitLab runner falls back to `sh` when the image has no bash,
      # and `<<<` is a bashism. `sed` drains its input (no early exit, so nothing SIGPIPEs `tr`).
      # The major this fragment ships with. ONE literal, read by the check, the message and the fallback
      # below, so they cannot drift apart; scripts/pin-major-check.sh holds it to the major a release
      # publishes. `yad update` rewrites this file and re-stamps .sdlc/cli-version.json together, so a
      # Product moves both to the new major at once — and a pin from an older major is skipped.
      YAD_MAJOR=4
      yad_pin_read() { # <file> <key>
        [ -f "$1" ] || return 0
        tr -d '\n' < "$1" 2>/dev/null | sed -nE "s/.*\"$2\"[[:space:]]*:[[:space:]]*\"([^\"]*)\".*/\1/p"
      }
      yad_pin_valid() { printf '%s' "${1:-}" | grep -Eq "^${YAD_MAJOR}\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?\$"; }
      # The Product settings under their new name first (E122); the old one until v5 deletes it.
      YAD_PIN_FILE=.sdlc/product.json; [ -f "$YAD_PIN_FILE" ] || YAD_PIN_FILE=.sdlc/hub.json
      YAD_PKG="${YAD_VERSION:-}"
      if [ -z "$YAD_PKG" ]; then
        for _cand in "$(yad_pin_read "$YAD_PIN_FILE" gate_sync_version)" "$(yad_pin_read .sdlc/cli-version.json version)"; do
          [ -n "$_cand" ] || continue
          if yad_pin_valid "$_cand"; then YAD_PKG="$_cand"; break; fi
          echo "yad-gate-sync: ignoring pin '${_cand}' — not an exact ${YAD_MAJOR}.x release." >&2
        done
      fi
      if [ -z "$YAD_PKG" ]; then
        YAD_PKG="$YAD_MAJOR"
        # A bare major is an npm RANGE, and a range never matches a prerelease: while only ${YAD_MAJOR}.0.0-next.N
        # exists, npm fails with ETARGET. Say what to do before that happens.
        echo "yad-gate-sync: no exact pin resolved — floating on yadflow@${YAD_MAJOR}. If npm cannot find it, run: yad update — and commit .sdlc/cli-version.json — or set YAD_VERSION." >&2
      fi
      echo "yad-gate-sync: running yadflow@${YAD_PKG}"
      # <<< yad-pin
    - |
      rc=0
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
        # SCHEDULED SWEEP — discover merged review MRs from the platform (Path B keeps no per-branch
        # ledger), then advance each. `gate ci` is idempotent DOWN TO THE BYTES: an already-`done` step
        # is never re-advanced, and re-syncing it rewrites the ledger in a canonical order, so an
        # unchanged approval record produces an unchanged file and nothing is committed. That last part
        # is load-bearing — before the #163 fix the re-sync re-appended each step's approvals at the
        # tail, so this loop rotated approvals.json and committed the reorder on every pass, forever
        # (issue #163). This job runs an exact pin resolved from the repo, so a Product still sitting on a
        # pre-3.15.3 yadflow keeps that behaviour — upgrade it or disable this schedule.
        # A stuck review MR (a squash merge whose commit dropped the branch name, or a failed merge
        # push) is always RECENT, so sweep a generous recent window and PAGINATE it fully (--paginate)
        # — this bounds cost without the old hard 50-row cap that could permanently strand older MRs.
        # Aggregate failures into rc and exit nonzero so a persistent failure surfaces (red pipeline)
        # instead of silently stranding a merged gate. Read from a file, not a pipe (a piped `while`
        # runs in a subshell, losing rc). An MR stuck beyond the window needs manual recovery — run
        # `yad gate ci --branch <review-branch> --pr <iid> --merged` locally on the default branch.
        SINCE="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-7d +%Y-%m-%dT%H:%M:%SZ)"
        glab api --paginate "projects/:id/merge_requests?state=merged&updated_after=${SINCE}&per_page=100&order_by=updated_at" > /tmp/yad-raw-mrs 2>/dev/null || rc=1
        jq -r '.[] | select(.source_branch | startswith("review/EP-")) | "\(.iid) \(.source_branch)"' /tmp/yad-raw-mrs > /tmp/yad-merged-mrs || rc=1
        while read -r IID REF; do
          [ -n "$IID" ] || continue
          git checkout -q -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
          npx -y -p "yadflow@${YAD_PKG}" yad gate ci --branch "$REF" --pr "$IID" --merged || rc=1
        done < /tmp/yad-merged-mrs
      else
        # MERGE push to the default branch whose commit names a review branch: resolve the merged MR's
        # IID from its source branch so `gate ci` can re-read approvals, then advance there.
        REVIEW_BRANCH="$(printf '%s' "$CI_COMMIT_MESSAGE" | grep -oE 'review/EP-[A-Za-z0-9._/-]+' | head -n1 || true)"
        if [ -n "$REVIEW_BRANCH" ]; then
          # `.[0].iid // empty` so an empty MR array yields an empty IID (jq prints "null" otherwise),
          # which keeps the "could not resolve" branch below correct.
          IID="$(glab api "projects/:id/merge_requests?source_branch=${REVIEW_BRANCH}&state=merged" 2>/dev/null | jq -r '.[0].iid // empty' || true)"
          if [ -n "$IID" ]; then
            # Pass --pr + IID as two distinct args (avoid a fragile, shell-dependent ${IID:+...} split).
            npx -y -p "yadflow@${YAD_PKG}" yad gate ci --branch "$REVIEW_BRANCH" --pr "$IID" --merged || rc=1
          else
            # Without the IID, gate ci cannot re-read approvals — fail visibly (the scheduled sweep
            # retries) rather than running a green no-op that silently leaves the gate unadvanced.
            echo "yad-gate-sync: could not resolve merged MR IID for ${REVIEW_BRANCH}" >&2
            rc=1
          fi
        fi
      fi
      exit $rc
