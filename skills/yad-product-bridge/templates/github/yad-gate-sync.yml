# yad-managed: yad-product-bridge
# Merge-time gate sync for the PRODUCT (Path B). CI is the SOLE writer of the ledger, and it
# writes ONLY at merge, ONLY to the default branch.
#
# During review there is NO CI write: the platform PR is the source of truth (native approvals +
# review threads). CI never pushes to the review branch, so an in-flight approval is never dismissed
# by a CI commit and the PR's required checks never strand on one. Because nothing is pushed to the
# PR head, you can safely enable "Dismiss stale pull request approvals when new commits are pushed"
# — only the artifact owner's own pushes will dismiss approvals (the intended revoke-on-change).
#
# Two jobs:
#   MERGE (PR closed + merged): the fast path. Check out the default branch (the human merge already
#   landed the artifact there) and run `yad gate ci --branch <head> --pr <n> --merged`. CI re-reads
#   the PR's approvals fresh from the platform, advances the step, and flips the artifact `status:` to
#   approved — committing that advance to the default branch with [skip ci].
#
#   RECONCILE (schedule, every 15 min): the safety net. The merge job's `closed` event fires once and
#   never repeats, so a transient API/GraphQL/push failure (or a fail-closed degraded approval read)
#   would otherwise strand a merged review until someone reran it by hand. This periodic job discovers
#   recently-merged review PRs from the API and advances any not yet done. Idempotent DOWN TO THE
#   BYTES: a step that is already `done` is never re-advanced (the chain is one-way), and re-syncing it
#   rewrites the ledger in a canonical order, so an unchanged approval record produces an unchanged file
#   and nothing is committed — re-visiting a merged review for a week costs one no-op read per pass. That
#   last part is load-bearing: before the #163 fix the re-sync re-appended each step's approvals at the
#   tail, so this job rotated approvals.json and committed the reorder every 15 minutes, forever (issue
#   #163). These jobs run an EXACT version resolved from the repo (see the resolver in each job), so a
#   Product sitting on a pre-#163 yadflow keeps that behaviour until someone upgrades it — if the resolved
#   pin is older than 3.15.3, run `yad update` or disable the schedule.
#   On GitHub a scheduled workflow runs automatically once committed (no setup).
#
# CI never approves and never merges — the merge click is the human approval act.
#
# Protected default branch? Only these jobs push there, and the built-in Actions token cannot get past
# branch protection or a ruleset: a ruleset's bypass list takes actors such as roles, teams and GitHub
# Apps, never GitHub Actions. So give the push a token whose owner may bypass, and pass it to actions/checkout
# below via `with: { token: ${{ secrets.SDLC_GATE_TOKEN }} }`:
#   a) a GitHub App on the bypass list (its installation token), or
#   b) a fine-grained PAT of someone on the bypass list, stored as the SDLC_GATE_TOKEN secret.
# See docs/branch-protection.md in the yadflow repo, and references/bridge.md.
name: yad-gate-sync
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "*/15 * * * *"

# Read-only by default. Each job below asks for the write access it needs, so a job added later
# does not inherit a token that can push.
permissions:
  contents: read

env:
  # The manual override for which yadflow these jobs run: set a repository (or organization) Actions
  # **variable** named YAD_VERSION to e.g. `4.0.0`, under Settings → Secrets and variables → Actions →
  # Variables. It lives there and not in this file, which `yad` owns and rewrites byte-for-byte from
  # its template on every sync — a version edited in here would be silently reverted.
  #
  # Left EMPTY the jobs resolve an exact pin from the repo itself instead of floating on the major (see
  # the resolver step in each job). Floating meant a release could change what a scheduled job does with
  # nobody deciding to upgrade — the amplification path in issue #163, where 3.13.1 took one Product from 20
  # to 96 churn commits an hour.
  YAD_VERSION: ${{ vars.YAD_VERSION || '' }}

jobs:
  mergesync:
    # The human merge of a review branch: advance the step + flip the artifact status on the default
    # branch. Nothing runs pre-merge — review state lives on the platform until the merge.
    if: >
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'review/EP-') &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Serialize every advance with the reconcile job — they all push the default branch.
    concurrency:
      group: yad-gate-mergesync
      cancel-in-progress: false
    permissions:
      contents: write # push the merge-advance ledger commit to the default branch
      pull-requests: read # gh pr view + reviewThreads GraphQL
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Check out the default branch — the merge already landed the artifact here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Resolve the yadflow pin
        run: |
          # >>> yad-pin
          # Which yadflow this job runs, most explicit source first:
          #   1. $YAD_VERSION            — the platform variable, a human's deliberate override, verbatim
          #   2. .sdlc/product.json      — "gate_sync_version" (.sdlc/hub.json when it is absent), the committed pin for this Product
          #   3. .sdlc/cli-version.json  — the version that last wired it (`yad update` re-stamps this)
          #   4. $YAD_MAJOR              — floating major, only when nothing above resolves
          # Sources 2 and 3 are machine-written files a stale or hand-edited checkout can get wrong, so
          # they are VALIDATED: an exact release token of the major this fragment was written for. That
          # also keeps the value safe to interpolate into `npx -p "yadflow@$V"` — a repo-controlled
          # string reaching a shell on a runner holding `contents: write` is the same class of hole the
          # HEAD_REF fix closed. Anything unparseable is skipped loudly rather than failing the run.
          # Pipes, not bash here-strings, so the block stays byte-identical to the GitLab fragment's
          # (which must run under `sh` when an image has no bash). `sed` drains its input, so nothing
          # SIGPIPEs `tr`.
          # The major this fragment ships with. ONE literal, read by the check, the message and the fallback
          # below, so they cannot drift apart; scripts/pin-major-check.sh holds it to the major a release
          # publishes. `yad update` rewrites this file and re-stamps .sdlc/cli-version.json together, so a
          # Product moves both to the new major at once — and a pin from an older major is skipped.
          YAD_MAJOR=4
          yad_pin_read() { # <file> <key>
            [ -f "$1" ] || return 0
            tr -d '\n' < "$1" 2>/dev/null | sed -nE "s/.*\"$2\"[[:space:]]*:[[:space:]]*\"([^\"]*)\".*/\1/p"
          }
          yad_pin_valid() { printf '%s' "${1:-}" | grep -Eq "^${YAD_MAJOR}\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?\$"; }
          # The Product settings under their new name first (E122); the old one until v5 deletes it.
          YAD_PIN_FILE=.sdlc/product.json; [ -f "$YAD_PIN_FILE" ] || YAD_PIN_FILE=.sdlc/hub.json
          YAD_PKG="${YAD_VERSION:-}"
          if [ -z "$YAD_PKG" ]; then
            for _cand in "$(yad_pin_read "$YAD_PIN_FILE" gate_sync_version)" "$(yad_pin_read .sdlc/cli-version.json version)"; do
              [ -n "$_cand" ] || continue
              if yad_pin_valid "$_cand"; then YAD_PKG="$_cand"; break; fi
              echo "yad-gate-sync: ignoring pin '${_cand}' — not an exact ${YAD_MAJOR}.x release." >&2
            done
          fi
          if [ -z "$YAD_PKG" ]; then
            YAD_PKG="$YAD_MAJOR"
            # A bare major is an npm RANGE, and a range never matches a prerelease: while only ${YAD_MAJOR}.0.0-next.N
            # exists, npm fails with ETARGET. Say what to do before that happens.
            echo "yad-gate-sync: no exact pin resolved — floating on yadflow@${YAD_MAJOR}. If npm cannot find it, run: yad update — and commit .sdlc/cli-version.json — or set YAD_VERSION." >&2
          fi
          echo "yad-gate-sync: running yadflow@${YAD_PKG}"
          # <<< yad-pin
          echo "YAD_PKG=${YAD_PKG}" >> "$GITHUB_ENV"
      - name: Advance the gate on merge
        # The head ref reaches the shell through `env:`, never through `${{ }}` inside `run:`. A
        # branch name may legally contain `$`, backticks and parentheses, so a PR opened from
        # `review/EP-x$(curl …)` would otherwise execute on a runner holding `contents: write` — and
        # the `if:` guard above does not stop it, since that name still starts with `review/EP-`.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name  "yad-gate-sync[bot]"
          git config user.email "yad-gate-sync[bot]@users.noreply.github.com"
          npx -y -p "yadflow@${YAD_PKG}" yad gate ci \
            --branch "$HEAD_REF" \
            --pr "$PR_NUMBER" \
            --merged

  reconcile:
    # Safety net: recover any merged review PR whose merge-time run failed transiently (the `closed`
    # event never re-fires). Idempotent — `yad gate ci` never re-advances a step that is already `done`,
    # and a re-sync of one writes nothing unless its approvals actually changed.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: yad-gate-mergesync
      cancel-in-progress: false
    permissions:
      contents: write # push the merge-advance ledger commit to the default branch
      pull-requests: read # gh pr view + reviewThreads GraphQL
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Resolve the yadflow pin
        run: |
          # >>> yad-pin
          # Which yadflow this job runs, most explicit source first:
          #   1. $YAD_VERSION            — the platform variable, a human's deliberate override, verbatim
          #   2. .sdlc/product.json      — "gate_sync_version" (.sdlc/hub.json when it is absent), the committed pin for this Product
          #   3. .sdlc/cli-version.json  — the version that last wired it (`yad update` re-stamps this)
          #   4. $YAD_MAJOR              — floating major, only when nothing above resolves
          # Sources 2 and 3 are machine-written files a stale or hand-edited checkout can get wrong, so
          # they are VALIDATED: an exact release token of the major this fragment was written for. That
          # also keeps the value safe to interpolate into `npx -p "yadflow@$V"` — a repo-controlled
          # string reaching a shell on a runner holding `contents: write` is the same class of hole the
          # HEAD_REF fix closed. Anything unparseable is skipped loudly rather than failing the run.
          # Pipes, not bash here-strings, so the block stays byte-identical to the GitLab fragment's
          # (which must run under `sh` when an image has no bash). `sed` drains its input, so nothing
          # SIGPIPEs `tr`.
          # The major this fragment ships with. ONE literal, read by the check, the message and the fallback
          # below, so they cannot drift apart; scripts/pin-major-check.sh holds it to the major a release
          # publishes. `yad update` rewrites this file and re-stamps .sdlc/cli-version.json together, so a
          # Product moves both to the new major at once — and a pin from an older major is skipped.
          YAD_MAJOR=4
          yad_pin_read() { # <file> <key>
            [ -f "$1" ] || return 0
            tr -d '\n' < "$1" 2>/dev/null | sed -nE "s/.*\"$2\"[[:space:]]*:[[:space:]]*\"([^\"]*)\".*/\1/p"
          }
          yad_pin_valid() { printf '%s' "${1:-}" | grep -Eq "^${YAD_MAJOR}\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?\$"; }
          # The Product settings under their new name first (E122); the old one until v5 deletes it.
          YAD_PIN_FILE=.sdlc/product.json; [ -f "$YAD_PIN_FILE" ] || YAD_PIN_FILE=.sdlc/hub.json
          YAD_PKG="${YAD_VERSION:-}"
          if [ -z "$YAD_PKG" ]; then
            for _cand in "$(yad_pin_read "$YAD_PIN_FILE" gate_sync_version)" "$(yad_pin_read .sdlc/cli-version.json version)"; do
              [ -n "$_cand" ] || continue
              if yad_pin_valid "$_cand"; then YAD_PKG="$_cand"; break; fi
              echo "yad-gate-sync: ignoring pin '${_cand}' — not an exact ${YAD_MAJOR}.x release." >&2
            done
          fi
          if [ -z "$YAD_PKG" ]; then
            YAD_PKG="$YAD_MAJOR"
            # A bare major is an npm RANGE, and a range never matches a prerelease: while only ${YAD_MAJOR}.0.0-next.N
            # exists, npm fails with ETARGET. Say what to do before that happens.
            echo "yad-gate-sync: no exact pin resolved — floating on yadflow@${YAD_MAJOR}. If npm cannot find it, run: yad update — and commit .sdlc/cli-version.json — or set YAD_VERSION." >&2
          fi
          echo "yad-gate-sync: running yadflow@${YAD_PKG}"
          # <<< yad-pin
          echo "YAD_PKG=${YAD_PKG}" >> "$GITHUB_ENV"
      - name: Reconcile recently-merged review PRs
        run: |
          git config user.name  "yad-gate-sync[bot]"
          git config user.email "yad-gate-sync[bot]@users.noreply.github.com"
          # A stuck merged review is always recent; window generously and let `gate ci` no-op the rest.
          # Page the search API fully (no fixed result cap) so a stuck PR is never missed for volume.
          # Aggregate failures and exit nonzero so a persistent API/push failure surfaces (red run)
          # instead of silently stranding a merged gate behind a green safety-net. Read from a file,
          # not a pipe, so the failure flag survives (a piped `while` runs in a subshell).
          SINCE="$(date -u -d '7 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-7d +%Y-%m-%d)"
          rc=0
          gh api --paginate -X GET search/issues \
            --raw-field q="repo:${GITHUB_REPOSITORY} type:pr is:merged merged:>=${SINCE}" \
            --jq '.items[].number' > /tmp/yad-merged-prs || rc=1
          while read -r N; do
            [ -n "$N" ] || continue
            REF="$(gh pr view "$N" --json headRefName --jq '.headRefName' 2>/dev/null)" || rc=1
            case "$REF" in
              review/EP-*) npx -y -p "yadflow@${YAD_PKG}" yad gate ci --branch "$REF" --pr "$N" --merged || rc=1 ;;
            esac
          done < /tmp/yad-merged-prs
          exit $rc
