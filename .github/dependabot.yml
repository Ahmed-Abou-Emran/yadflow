version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci):"
    # Every github/codeql-action step in a workflow must run the same version, or the job fails.
    # One grouped PR bumps init, analyze and upload-sarif together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
